# Terrain-specific configurations
terrains:
  flat:
    name: "Flat Terrain"
    description: "Smooth, flat ground"
    friction: 1.0
    damping: 0.0
    roughness: 0.0
    slope: 0.0
    reward_scale: 1.0
    
  rocky:
    name: "Rocky Terrain"
    description: "Uneven, rocky ground with obstacles"
    friction: 1.2
    damping: 0.1
    roughness: 0.5
    slope: 0.0
    reward_scale: 1.2
    
  slopes:
    name: "Sloped Terrain"
    description: "Inclined/declined terrain"
    friction: 1.0
    damping: 0.05
    roughness: 0.1
    slope: 15.0  # degrees
    reward_scale: 1.1
    
  stairs:
    name: "Stairs"
    description: "Step-like terrain"
    friction: 1.1
    damping: 0.08
    roughness: 0.2
    slope: 0.0
    reward_scale: 1.3

# Training progression
curriculum:
  enabled: false
  schedule:
    - terrain: "flat"
      steps: 0
    - terrain: "rocky"
      steps: 250000
    - terrain: "slopes"
      steps: 500000
